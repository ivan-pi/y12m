name: CI

# Run on pushes to main and on pull requests; without the branch filter
# every push to a PR branch would trigger each job twice (push event +
# pull_request event).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-flight runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-generated:
    name: generated sources in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install fypp
        run: pip install fypp

      - name: Regenerate legacy sources from templates
        run: make -C templates

      - name: Verify templates and generated sources have not diverged
        run: |
          git diff --exit-code || {
            echo "::error::Generated sources in src/legacy/ are out of sync with templates/*.fpp."
            echo "Run 'make -C templates' and commit the regenerated files."
            exit 1
          }

  build-and-test:
    name: ${{ matrix.os }} / gfortran-${{ matrix.gcc }}${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gcc: 14
          # Exercise the double-double fallback path of y12mff even though
          # gfortran has quad precision, with both TwoProd variants
          # (default Dekker splitting, and the IEEE_FMA intrinsic).
          - os: ubuntu-latest
            gcc: 14
            cmake_args: -DY12M_FORCE_DOUBLE_DOUBLE=ON
            suffix: " (double-double)"
          - os: ubuntu-latest
            gcc: 14
            cmake_args: -DY12M_FORCE_DOUBLE_DOUBLE=ON -DY12M_USE_IEEE_FMA=ON
            suffix: " (double-double, ieee_fma)"
          - os: macos-latest
            gcc: 14

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_Fortran_COMPILER=gfortran-${{ matrix.gcc }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  flang:
    name: macos-latest / flang
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install flang
        run: |
          brew install flang
          flang-new --version

      - name: Configure
        run: cmake -B build -DCMAKE_Fortran_COMPILER=$(brew --prefix flang)/bin/flang-new -DCMAKE_Fortran_FLAGS="-pedantic"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
