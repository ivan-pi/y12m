name: CI

on:
  push:
  pull_request:

jobs:
  check-generated:
    name: generated sources in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install fypp
        run: pip install fypp

      - name: Regenerate legacy sources from templates
        run: make -C templates

      - name: Verify templates and generated sources have not diverged
        run: |
          git diff --exit-code || {
            echo "::error::Generated sources in src/legacy/ are out of sync with templates/*.fpp."
            echo "Run 'make -C templates' and commit the regenerated files."
            exit 1
          }

  build-and-test:
    name: ${{ matrix.os }} / gfortran-${{ matrix.gcc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gcc: 14
          - os: macos-latest
            gcc: 14

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_Fortran_COMPILER=gfortran-${{ matrix.gcc }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  flang:
    name: macos-latest / flang
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install flang
        run: |
          brew install flang
          flang-new --version

      - name: Configure
        run: cmake -B build -DCMAKE_Fortran_COMPILER=$(brew --prefix flang)/bin/flang-new -DCMAKE_Fortran_FLAGS="-pedantic"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
