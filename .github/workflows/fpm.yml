# Assisted-by: Claude Code:claude-fable-5
name: fpm

# Run on pushes to main and on pull requests; without the branch filter
# every push to a PR branch would trigger each job twice (push event +
# pull_request event).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-flight runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fpm-build:
    name: ubuntu-latest / fpm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup fpm
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Versions
        run: |
          fpm --version
          gfortran --version

      # Only the library is built: the test suite and the example programs
      # rely on CMake-specific layout and preprocessing (see fpm.toml,
      # auto-tests/auto-examples are disabled).
      - name: Build library
        run: fpm build --verbose
